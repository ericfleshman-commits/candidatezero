# Filter rules. The engine has no hardcoded taste: everything it keeps or drops
# is decided by this file. Copy it to config/private/filters.yaml and edit that
# copy. The private one wins when it exists, per file.
#
# Evaluation order is title, then location, then comp. Cheap checks first, and on
# Greenhouse the expensive per-role detail fetch only happens for roles that have
# already survived title and location.

title_families:
  # Substring match against the normalized title. Normalization lowercases,
  # collapses "go to market" and "go-to-market" to "gtm", and strips punctuation,
  # so "Go-To-Market Engineer" matches "gtm engineer".
  include:
    - gtm engineer
    - gtm engineering
    - go-to-market engineer
    - gtm systems
    - revops engineer
    - revenue operations engineer
    - revops architect
    - revenue operations architect
    - ai gtm
    - gtm ai
    - revenue systems
  # Adjacent families worth seeing but not worth trusting. These are surfaced in
  # the Flagged section and are never auto-dropped.
  flag:
    - growth engineer

location:
  # A role passes on location if it is NYC or acceptable remote.
  nyc_tokens: [new york, nyc, brooklyn, manhattan]
  allow_remote_us: true
  # Remote qualified by a non-US region is not remote for this candidate.
  remote_exclude_regions: [emea, europe, apac, uk, canada, latam, india]
  # A remote role must show a US signal somewhere in its location: one of these
  # tokens (word-bounded), or a ", XX" US state code. Without one it is kept
  # and flagged remote-geo-unverified, never dropped. This closes the gap where
  # a role marked remote out of a non-US city sailed through as "Remote".
  us_signal_tokens:
    [united states, usa, u.s., us, america,
     san francisco, austin, chicago, seattle, boston, denver, atlanta,
     los angeles, miami, salt lake city, washington dc]
  us_state_codes:
    [al, ak, az, ar, ca, co, ct, de, fl, ga, hi, id, il, in, ia, ks, ky, la,
     ma, md, me, mi, mn, mo, ms, mt, nc, nd, ne, nh, nj, nm, nv, ny, oh, ok,
     or, pa, ri, sc, sd, tn, tx, ut, va, vt, wa, wi, wv, wy, dc]
  # Optional escape hatch: a role that fails location is kept and flagged rather
  # than dropped when the top of its band clears this number. Money moves people.
  # Remove the key to disable the exception entirely.
  kill_exception_comp_usd: 200000

comp:
  # Pass if comp_max is at or above the floor.
  #   comp_min at or above floor  : clean pass
  #   only comp_max clears        : kept, flagged band-top-only
  #   no comp published           : kept, flagged comp-unknown
  # Unknown comp is a flag and not a failure. The NYC pay transparency law means
  # most target roles post a band, so a missing band is a question, not a no.
  floor_usd: 160000

# Shape rule packs: what the role actually is, read from the JD itself. A title
# can say GTM Engineer while the description asks for a React frontend engineer;
# these packs catch that on the description's own words.
#
# Semantics: phrases are matched case-insensitively over title plus description,
# tolerant of punctuation between words ("ci/cd" also hits "CI / CD" and
# "ci-cd", "a/b test" hits "A/B test"). Any hit moves the role from PASS to
# FLAGGED carrying the pack name, and the digest quotes the exact phrase that
# matched. A role can carry several packs. Shape never hard-drops on its own.
shapes:
  # A software-engineer seat wearing a GTM title. Named stacks first, then the
  # generic vocabulary of SWE job ads: a JD that says "full-stack" about the
  # candidate's own work is describing an engineer, whatever the title says.
  # "full stack" also hits "full-stack" (separator-tolerant), same for
  # "front end" and "front-end".
  shape-swe:
    - software engineer
    - full stack
    - frontend
    - front end
    - backend
    - back end
    - typescript
    - apex
    - lightning web components
    - lwc
    - ci/cd
    - production code
    - code review
    - code reviews
    - langgraph
    - react
    - next.js
    - nextjs
    - a/b test
    - a/b tests
    - a/b testing
    - computer science degree
    - degree in computer science
    - bs in computer science
  # A quota seat wearing a GTM title.
  shape-sales:
    - quota
    - quotas
    - closing experience
    - pipeline generation
    - cold call
    - cold calls
    - cold calling
    - ae
    - bdr
    - sdr
    - account executive
    - business development representative
    - sales development representative
    - uncapped commission
    - commission-based
    - ote
    - on-target earnings
  # Graded for years the target candidate left behind long ago.
  shape-junior:
    - 1-3 years
    - 1 to 3 years
    - 0-2 years
    - 1-2 years
    - 2-3 years
    - early career
    - entry level
    - associate
    - junior
    - new grad
    - recent graduate
  # Not the employer. Staffing firms and confidential postings.
  shape-agency:
    - staffing
    - our client
    - recruiting firm
    - recruitment agency
    - recruiting agency
    - search firm
    - executive search
    - talent agency
    - confidential company
    - company confidential
    - confidential client
