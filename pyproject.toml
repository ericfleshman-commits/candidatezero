[project]
name = "candidatezero"
version = "0.1.0"
description = "Watches company ATS boards overnight and keeps only the GTM engineering and RevOps roles that are verified live on the employer's own system."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
engine = "engine.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real ATS endpoints. Excluded by default, run with -m live.",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
